<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1320" viewBox="0 0 840 1320" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic preview of a new DeepSeek Harness picture-in-picture chat</title>
  <desc id="desc">An empty compact dark chat window, ready for the first message, with a new-chat action and a centered composer.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#617fd8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#617fd8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <style>
      .ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .title{font-size:25px;font-weight:700;fill:#f4f4f6}
      .hero{font-size:46px;font-weight:550;letter-spacing:-1px;fill:#f2f2f4}
      .body{font-size:25px;fill:#e7e7ea}
      .small{font-size:22px;fill:#a6a6ae}
      .tiny{font-size:18px;fill:#898991}
      .hair{stroke:#3b3b40;stroke-width:2}
      .icon{stroke:#a6a6ae;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .accent-icon{stroke:#7891ff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
    </style>
  </defs>

  <rect width="840" height="1320" fill="#0d0d0f"/>
  <g filter="url(#shadow)">
    <rect width="840" height="1320" fill="#151517"/>
  </g>

  <!-- Header -->
  <rect width="840" height="108" fill="#151517"/>
  <line x1="0" y1="107" x2="840" y2="107" class="hair"/>
  <g transform="translate(40 34)">
    <path d="M1 18c7-11 17-16 29-16 8 0 15 3 20 8l10-5c1-1 2 0 2 2l-3 11 3 11c0 2-1 3-2 2l-10-5c-5 5-12 8-20 8C18 34 8 29 1 18Z" fill="#f1f1f3" transform="scale(.56)"/>
    <circle cx="7" cy="5.5" r="1.2" fill="#151517"/>
  </g>
  <text x="92" y="67" class="ui title">New chat</text>
  <path d="M642 49h20a7 7 0 0 1 7 7v8a7 7 0 0 1-7 7h-12l-8 6V49Z" class="accent-icon"/>
  <path d="M655 55v10M650 60h10" class="accent-icon"/>
  <g transform="translate(704 40)" class="icon">
    <path d="M3 8v25h25"/><path d="m13 23 20-20M21 3h12v12"/>
  </g>
  <g transform="translate(773 42)" class="icon"><path d="m0 0 25 25M25 0 0 25"/></g>

  <!-- Empty-chat stage -->
  <ellipse cx="420" cy="714" rx="520" ry="310" fill="url(#glow)"/>
  <g class="ui">
    <g transform="translate(174 510)">
      <path d="M0 34c13-21 33-32 55-32 15 0 28 5 38 14l18-9c2-1 4 1 3 3l-6 24 6 24c1 2-1 4-3 3l-18-9c-10 9-23 14-38 14C33 66 13 55 0 34Z" fill="#f1f1f3"/>
      <circle cx="34" cy="25" r="3" fill="#151517"/>
      <text x="132" y="49" class="hero">Into the Unknown</text>
      <rect x="493" y="19" width="102" height="34" rx="17" fill="#1d2440" stroke="#293359" stroke-width="2"/>
      <text x="515" y="43" class="tiny" fill="#7891ff">Preview</text>
    </g>

    <!-- Composer -->
    <g transform="translate(44 648)">
      <rect width="752" height="252" rx="48" fill="#2a2a2e" stroke="#48484f" stroke-width="2"/>
      <text x="34" y="64" class="body" fill="#a6a6ae">Reply to the agent…</text>
      <text x="49" y="174" class="small">＋</text>
      <text x="104" y="174" class="small">Full access</text>
      <path d="m226 163 8 8 8-8" class="icon"/>
      <text x="278" y="174" class="small">Plan</text>
      <text x="366" y="174" class="small">GPT-5.6 Sol</text>
      <path d="m517 163 8 8 8-8" class="icon"/>
      <circle cx="574" cy="167" r="17" fill="none" stroke="#4b4b52" stroke-width="6"/>
      <path d="M574 150a17 17 0 0 1 14 27" fill="none" stroke="#607cff" stroke-width="6" stroke-linecap="round"/>
      <circle cx="695" cy="167" r="34" fill="#222226"/>
      <path d="M681 167h24m-9-9 9 9-9 9" stroke="#777780" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="34" y="224" class="tiny">Enter to send · Shift+Enter for a new line</text>
    </g>
  </g>
</svg>
