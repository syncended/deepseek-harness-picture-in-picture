<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1320" viewBox="0 0 840 1320" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic preview of the DeepSeek Harness picture-in-picture chat</title>
  <desc id="desc">A compact dark chat window with tool activity, a running status, todo and goal docks, and a reply composer.</desc>
  <defs>
    <linearGradient id="status" x1="0" x2="1">
      <stop offset="0" stop-color="#6f8cff"/>
      <stop offset="0.46" stop-color="#8ba1ff"/>
      <stop offset="0.55" stop-color="#d8dfff"/>
      <stop offset="0.64" stop-color="#8ba1ff"/>
      <stop offset="1" stop-color="#6f8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#607cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#607cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <style>
      .ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .title{font-size:25px;font-weight:700;fill:#f4f4f6}
      .body{font-size:25px;fill:#e7e7ea}
      .small{font-size:22px;fill:#a6a6ae}
      .tiny{font-size:18px;fill:#898991}
      .strong{font-weight:650}
      .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:21px;fill:#c5c5cb}
      .hair{stroke:#3b3b40;stroke-width:2}
      .icon{stroke:#a6a6ae;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
    </style>
  </defs>

  <rect width="840" height="1320" fill="#0d0d0f"/>
  <circle cx="420" cy="660" r="420" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect x="0" y="0" width="840" height="1320" fill="#151517"/>
  </g>

  <!-- Header -->
  <rect x="0" y="0" width="840" height="108" fill="#151517"/>
  <line x1="0" y1="107" x2="840" y2="107" class="hair"/>
  <g transform="translate(40 34)">
    <ellipse cx="14" cy="18" rx="14" ry="10" fill="#f1f1f3"/>
    <path d="M1 18-8 10v16Z" fill="#f1f1f3"/>
    <circle cx="21" cy="15" r="2" fill="#151517"/>
  </g>
  <text x="116" y="66" class="ui title">Harness PiP polish</text>
  <path d="m622 55 8 8 8-8" class="icon"/>
  <g transform="translate(692 40)" class="icon">
    <path d="M3 8v25h25"/><path d="m13 23 20-20M21 3h12v12"/>
  </g>
  <g transform="translate(773 42)" class="icon"><path d="m0 0 25 25M25 0 0 25"/></g>

  <!-- Conversation -->
  <g class="ui">
    <g transform="translate(38 144)">
      <rect x="0" y="0" width="764" height="58" rx="12" fill="#1c1c1f"/>
      <path d="M20 21h18v16H20zM24 25l4 4-4 4" class="icon"/>
      <text x="58" y="38" class="small strong" fill="#d8d8dc">Bash</text>
      <text x="122" y="38" class="small">· Validate native-style tool activity</text>
      <path d="m720 24 8 8 8-8" class="icon"/>
    </g>
    <g transform="translate(38 218)">
      <path d="M9 12a9 9 0 1 1 18 0c0 5-4 6-4 11H13c0-5-4-6-4-11ZM14 29h8" class="icon"/>
      <text x="46" y="24" class="small strong" fill="#d8d8dc">Think</text>
      <text x="112" y="24" class="small">· Aligning the mini chat with native UI</text>
      <path d="m742 7 8 8 8-8" class="icon"/>
    </g>
    <g transform="translate(38 278)">
      <path d="M9 12a9 9 0 1 1 18 0c0 5-4 6-4 11H13c0-5-4-6-4-11ZM14 29h8" class="icon"/>
      <text x="46" y="24" class="small strong" fill="#d8d8dc">Think</text>
      <text x="112" y="24" class="small">· Checking compact layout and overflow</text>
      <path d="m742 7 8 8 8-8" class="icon"/>
    </g>
    <g transform="translate(38 350)">
      <rect x="0" y="0" width="764" height="124" rx="14" fill="#1b1b1e"/>
      <path d="M20 20h20v18H20z" class="icon"/>
      <text x="58" y="38" class="small strong" fill="#d8d8dc">Edit</text>
      <text x="112" y="38" class="small">· lib/client.js</text>
      <line x1="20" y1="58" x2="744" y2="58" class="hair"/>
      <text x="20" y="91" class="tiny strong">INPUT</text>
      <text x="94" y="91" class="mono">Replace status row with native footer</text>
    </g>
    <g transform="translate(38 502)">
      <text x="0" y="30" class="body">The PiP view now mirrors the native conversation flow:</text>
      <text x="0" y="73" class="body">compact activity, live queue controls, and a focused composer.</text>
    </g>
    <g transform="translate(38 626)">
      <rect x="510" y="0" width="254" height="96" rx="40" fill="#26262a"/>
      <text x="548" y="39" class="small" fill="#f1f1f3">Looks much clearer.</text>
      <text x="548" y="70" class="tiny">You</text>
    </g>
    <g transform="translate(38 754)">
      <text x="0" y="30" class="small strong" fill="url(#status)">Deep diving…</text>
      <text x="158" y="30" class="small">1m 24s</text>
    </g>
  </g>

  <!-- Docks -->
  <g class="ui">
    <rect x="28" y="814" width="784" height="72" rx="24" fill="#202023" stroke="#414147" stroke-width="2"/>
    <rect x="48" y="836" width="22" height="22" rx="4" fill="none" stroke="#b4b4bb" stroke-width="2"/>
    <path d="m53 847 5 5 9-12" class="icon"/>
    <text x="86" y="859" class="small strong" fill="#efeff1">To-dos</text>
    <text x="175" y="859" class="small">1 active · 3 pending</text>
    <path d="m764 856 8-8 8 8" class="icon"/>

    <rect x="28" y="900" width="784" height="66" rx="24" fill="#202023" stroke="#414147" stroke-width="2"/>
    <text x="48" y="941" class="small strong" fill="#efeff1">Goal</text>
    <text x="116" y="941" class="small">Bring the PiP chat closer to native Harness…</text>
    <rect x="690" y="918" width="96" height="30" rx="15" fill="#25305e"/>
    <text x="707" y="940" class="tiny" fill="#7891ff">active</text>
  </g>

  <!-- Composer -->
  <g class="ui">
    <rect x="40" y="988" width="760" height="240" rx="40" fill="#2a2a2e" stroke="#48484f" stroke-width="2"/>
    <text x="74" y="1048" class="body" fill="#a6a6ae">Reply to the agent…</text>
    <text x="92" y="1158" class="small">＋</text>
    <text x="145" y="1158" class="small">Full access</text>
    <path d="m268 1147 8 8 8-8" class="icon"/>
    <text x="318" y="1158" class="small">Plan</text>
    <text x="405" y="1158" class="small">GPT-5.6 Sol</text>
    <path d="m556 1147 8 8 8-8" class="icon"/>
    <circle cx="610" cy="1151" r="16" fill="none" stroke="#4b4b52" stroke-width="6"/>
    <path d="M610 1135a16 16 0 1 1-14 24" fill="none" stroke="#607cff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="742" cy="1151" r="34" fill="#f4f4f5"/>
    <rect x="732" y="1141" width="20" height="20" rx="4" fill="#151517"/>
    <text x="74" y="1204" class="tiny">The reply will be queued after the current turn</text>
  </g>

  <!-- Stats -->
  <g class="ui tiny">
    <text x="48" y="1268">Context 72% · 194K/272K</text>
    <text x="334" y="1268">31 turns · 918 steps</text>
    <text x="610" y="1268">64 tok/s</text>
    <text x="48" y="1297">Input 141M · Output 228K · cache 96%</text>
  </g>
</svg>
